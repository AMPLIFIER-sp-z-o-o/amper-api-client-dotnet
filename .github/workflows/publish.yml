name: Publish to NuGet

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write   # required for NuGet Trusted Publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SDK 8 can still build net5.0 / netcoreapp3.1; net452 uses the
      # Microsoft.NETFramework.ReferenceAssemblies package the SDK adds automatically.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack
        run: dotnet pack AmperApiClient.NET.csproj -c Release -o out -p:GeneratePackageOnBuild=false

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push "out/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
